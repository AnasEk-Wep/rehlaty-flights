<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>تسجيل الدخول · لوحة التحكم</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0F172A; --blue: #2563EB; --blue2: #1D4ED8; --line: #E2E8F0; --muted: #475569; --canvas: #F8FAFC; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--canvas); color: var(--navy);
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; }
  header { background: var(--navy); color: #fff; }
  header .in { max-width: 1120px; margin: auto; padding: 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  header a { margin-right: auto; color: rgba(255,255,255,.7); font-size: 14px; font-weight: 500; text-decoration: none; }
  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  form { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 28px 24px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 28px rgba(15,23,42,.08); }
  h1 { margin: 0; font-size: 22px; }
  p.sub { margin: 6px 0 20px; color: var(--muted); font-size: 14px; }
  label { display: block; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
  input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    font: inherit; font-size: 15px; outline: none; background: #fff; }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .pw { position: relative; }
  .pw-box { position: relative; display: block; margin-top: 6px; }
  .pw-box input { margin-top: 0; padding-left: 42px; } /* مساحة للأيقونة في الطرف الأيسر (الحقل LTR داخل صفحة RTL) */
  .pw-box button { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; padding: 0; }
  .pw-box button:hover { color: var(--blue); background: rgba(37,99,235,.08); }
  .pw-box button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .pw-box svg { width: 20px; height: 20px; }
  .pw-box svg[hidden] { display: none; }
  .btn { width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 12px; background: var(--blue); color: #fff;
    font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .btn:hover { background: var(--blue2); } .btn:disabled { opacity: .6; cursor: wait; }
  .msg { display: none; margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  .msg.err { display: block; background: #FEF2F2; color: #B91C1C; }
  .msg.info { display: block; background: #EFF6FF; color: var(--blue2); }
  .hint { margin-top: 16px; font-size: 12px; color: #94A3B8; text-align: center; }
</style>
</head>
<body>
<header><div class="in"><img src="/favicon.svg" alt="" width="34" height="34"><span id="site">لوحة التحكم</span><a href="/">← الموقع</a></div></header>
<main>
  <form id="f" novalidate>
    <h1>تسجيل الدخول</h1>
    <p class="sub">لوحة تحكم الحجوزات والرحلات</p>
    <p id="msg" class="msg" role="alert"></p>
    <label>اسم المستخدم
      <input id="u" name="username" autocomplete="username" dir="ltr" required autofocus>
    </label>
    <label class="pw">كلمة المرور
      <span class="pw-box">
        <input id="p" name="password" type="password" autocomplete="current-password" dir="ltr" required>
        <button type="button" id="eye" aria-label="إظهار كلمة المرور" aria-pressed="false" title="إظهار كلمة المرور">
          <svg data-eye="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg data-eye="hide" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>
        </button>
      </span>
    </label>
    <button class="btn" id="go">دخول</button>
    <p class="hint">الجلسة تبقى 12 ساعة على هذا الجهاز، ثم يُطلب الدخول من جديد.</p>
  </form>
</main>
<script>
  const $ = s => document.querySelector(s);
  const msg = (t, cls = 'err') => { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + cls; };
  if (new URLSearchParams(location.search).has('expired')) msg('انتهت الجلسة — سجّل الدخول من جديد.', 'info');
  // إذا كانت الجلسة ما زالت فعّالة نذهب للوحة مباشرة
  fetch('/api/admin/me', { credentials: 'same-origin' }).then(r => { if (r.ok) location.replace('/admin.html'); }).catch(() => {});
  fetch('/api/settings').then(r => r.json()).then(s => { if (s.site_name) { $('#site').textContent = s.site_name + ' · لوحة التحكم'; document.title = 'تسجيل الدخول · ' + s.site_name; } }).catch(() => {});
  $('#eye').addEventListener('click', () => {
    const p = $('#p'), eye = $('#eye'), show = p.type === 'password', label = show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور';
    p.type = show ? 'text' : 'password';
    eye.querySelector('[data-eye=show]').toggleAttribute('hidden', show); eye.querySelector('[data-eye=hide]').toggleAttribute('hidden', !show);
    eye.setAttribute('aria-label', label); eye.title = label; eye.setAttribute('aria-pressed', show);
    p.focus({ preventScroll: true });
  });
  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const username = $('#u').value.trim(), password = $('#p').value;
    if (!username || !password) return msg('أدخل اسم المستخدم وكلمة المرور');
    $('#go').disabled = true; $('#go').textContent = 'جارٍ الدخول…';
    try {
      const r = await fetch('/api/admin/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'تعذر الدخول');
      location.replace('/admin.html');
    } catch (err) {
      msg(err.message === 'Failed to fetch' ? 'تعذر الاتصال بالسيرفر' : err.message);
      $('#p').value = ''; $('#p').focus();
    } finally { $('#go').disabled = false; $('#go').textContent = 'دخول'; }
  });
</script>
</body>
</html>
